<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 997" role="img">
  <title>PhonePi Clock alarm list wireframe</title>
  <desc>Dark theme alarm list on a 448 by 997 dp canvas. Armed strip, Saturday morning ladder set by a bot, and a skipped alarm.</desc>
  <rect width="448" height="997" fill="#101412"/>
  <text x="20" y="28" fill="#8B938C" font-family="Roboto, sans-serif" font-size="12" font-weight="500">Alarm list | dark | 448 dp</text>
  <text x="380" y="28" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="12">9:41</text>
  <rect x="20" y="48" width="408" height="72" rx="28" fill="#1E2521"/>
  <rect x="20" y="60" width="4" height="48" rx="2" fill="#7DDBB4"/>
  <text x="40" y="78" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="16" font-weight="500">Next | Sat 7:45 AM</text>
  <text x="40" y="100" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="13">in 7 h 12 min | Armed</text>
  <circle cx="400" cy="84" r="6" fill="#7DDBB4"/>
  <rect x="20" y="132" width="408" height="64" rx="28" fill="#3D3214"/>
  <text x="36" y="158" fill="#E8C27A" font-family="Roboto, sans-serif" font-size="13" font-weight="500">Google Clock also has 7:45 AM</text>
  <text x="36" y="178" fill="#F3E2B8" font-family="Roboto, sans-serif" font-size="12">This one still rings. Open Google Clock</text>
  <rect x="20" y="208" width="408" height="420" rx="28" fill="#1E2521"/>
  <rect x="20" y="224" width="4" height="48" rx="2" fill="#7DDBB4"/>
  <text x="40" y="246" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="20" font-weight="500">Saturday morning</text>
  <rect x="340" y="224" width="52" height="32" rx="16" fill="#1E4E44"/>
  <circle cx="376" cy="240" r="12" fill="#8FD9C6"/>
  <text x="40" y="286" fill="#F3E2B8" font-family="Roboto, sans-serif" font-size="13" font-weight="500">Bot | Set by Morning bot | Tue</text>
  <text x="40" y="312" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="13">Repeats Sat | 4 alarms</text>
  <line x1="48" y1="340" x2="48" y2="500" stroke="#7DDBB4" stroke-width="2"/>
  <circle cx="48" cy="348" r="5" fill="#7DDBB4"/>
  <text x="68" y="356" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="26" font-weight="500">7:45</text>
  <text x="160" y="354" fill="#7DDBB4" font-family="Roboto, sans-serif" font-size="13">in 7 h 12 min</text>
  <circle cx="48" cy="400" r="5" fill="#8B938C"/>
  <text x="68" y="408" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="26" font-weight="500">7:55</text>
  <circle cx="48" cy="452" r="5" fill="#8B938C"/>
  <text x="68" y="460" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="26" font-weight="500">8:05</text>
  <circle cx="48" cy="504" r="5" fill="#8B938C"/>
  <text x="68" y="512" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="26" font-weight="500">8:15</text>
  <rect x="36" y="540" width="376" height="48" rx="24" fill="#28302B"/>
  <text x="224" y="570" text-anchor="middle" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="14" font-weight="500">Skip this Saturday</text>
  <text x="36" y="612" fill="#8B938C" font-family="Roboto, sans-serif" font-size="12">Tap a time to edit. The switch turns all four on or off.</text>
  <rect x="20" y="648" width="408" height="100" rx="28" fill="#1E2521"/>
  <text x="40" y="688" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="28" font-weight="500">9:00 AM</text>
  <text x="40" y="722" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="13">Weekday | Skipped Mon | Undo skip</text>
  <rect x="348" y="692" width="52" height="32" rx="16" fill="#1E4E44"/>
  <circle cx="384" cy="708" r="12" fill="#8FD9C6"/>
  <rect x="20" y="820" width="408" height="64" rx="32" fill="#8FD9C6"/>
  <text x="224" y="858" text-anchor="middle" fill="#062E26" font-family="Roboto, sans-serif" font-size="16" font-weight="500">New alarm</text>
  <text x="48" y="962" text-anchor="middle" fill="#8FD9C6" font-family="Roboto, sans-serif" font-size="12" font-weight="500">Alarms</text>
  <text x="140" y="962" text-anchor="middle" fill="#8B938C" font-family="Roboto, sans-serif" font-size="12">Timers</text>
  <text x="230" y="962" text-anchor="middle" fill="#8B938C" font-family="Roboto, sans-serif" font-size="12">Watch</text>
  <text x="320" y="962" text-anchor="middle" fill="#8B938C" font-family="Roboto, sans-serif" font-size="12">World</text>
  <text x="400" y="962" text-anchor="middle" fill="#8B938C" font-family="Roboto, sans-serif" font-size="12">Bed</text>
</svg>
