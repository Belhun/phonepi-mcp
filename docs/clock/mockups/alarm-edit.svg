<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 997" role="img">
  <title>PhonePi Clock alarm editor wireframe</title>
  <desc>Editor for the Saturday morning ladder. Keypad is selected. Days, rungs, and shared settings sit above a sticky Save.</desc>
  <rect width="448" height="997" fill="#101412"/>
  <text x="20" y="36" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="16" font-weight="500">Back</text>
  <text x="80" y="36" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="16" font-weight="500">Edit alarm</text>
  <text x="360" y="36" fill="#8FD9C6" font-family="Roboto, sans-serif" font-size="14" font-weight="500">History</text>
  <text x="20" y="78" fill="#8B938C" font-family="Roboto, sans-serif" font-size="12">Name</text>
  <text x="20" y="106" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="22" font-weight="500">Saturday morning</text>
  <text x="20" y="132" fill="#F3E2B8" font-family="Roboto, sans-serif" font-size="13">Bot | Changed by Morning bot | 2 h ago</text>
  <text x="20" y="188" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="36" font-weight="500">7:45</text>
  <rect x="160" y="156" width="120" height="40" rx="20" fill="#28302B"/>
  <text x="186" y="182" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="14" font-weight="500">AM</text>
  <text x="236" y="182" fill="#8B938C" font-family="Roboto, sans-serif" font-size="14">PM</text>
  <rect x="20" y="208" width="120" height="36" rx="18" fill="#1E4E44"/>
  <text x="80" y="231" text-anchor="middle" fill="#B7F0E2" font-family="Roboto, sans-serif" font-size="13" font-weight="500">Keypad</text>
  <rect x="148" y="208" width="100" height="36" rx="18" fill="#1E2521"/>
  <text x="198" y="231" text-anchor="middle" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="13">Dial</text>
  <g font-family="Roboto, sans-serif" font-size="22" font-weight="500" fill="#E7E6E1">
    <rect x="20" y="260" width="128" height="52" rx="16" fill="#28302B"/><text x="84" y="294" text-anchor="middle">1</text>
    <rect x="160" y="260" width="128" height="52" rx="16" fill="#28302B"/><text x="224" y="294" text-anchor="middle">2</text>
    <rect x="300" y="260" width="128" height="52" rx="16" fill="#28302B"/><text x="364" y="294" text-anchor="middle">3</text>
    <rect x="20" y="320" width="128" height="52" rx="16" fill="#28302B"/><text x="84" y="354" text-anchor="middle">4</text>
    <rect x="160" y="320" width="128" height="52" rx="16" fill="#28302B"/><text x="224" y="354" text-anchor="middle">5</text>
    <rect x="300" y="320" width="128" height="52" rx="16" fill="#28302B"/><text x="364" y="354" text-anchor="middle">6</text>
    <rect x="20" y="380" width="128" height="52" rx="16" fill="#28302B"/><text x="84" y="414" text-anchor="middle">7</text>
    <rect x="160" y="380" width="128" height="52" rx="16" fill="#28302B"/><text x="224" y="414" text-anchor="middle">8</text>
    <rect x="300" y="380" width="128" height="52" rx="16" fill="#28302B"/><text x="364" y="414" text-anchor="middle">9</text>
    <rect x="160" y="440" width="128" height="52" rx="16" fill="#28302B"/><text x="224" y="474" text-anchor="middle">0</text>
    <rect x="300" y="440" width="128" height="52" rx="16" fill="#28302B"/><text x="364" y="472" text-anchor="middle" font-size="14">Delete</text>
  </g>
  <g font-family="Roboto, sans-serif" font-size="12" font-weight="500">
    <rect x="20" y="512" width="52" height="40" rx="20" fill="#28302B"/><text x="46" y="537" text-anchor="middle" fill="#C1C8C2">Mon</text>
    <rect x="78" y="512" width="52" height="40" rx="20" fill="#28302B"/><text x="104" y="537" text-anchor="middle" fill="#C1C8C2">Tue</text>
    <rect x="136" y="512" width="52" height="40" rx="20" fill="#28302B"/><text x="162" y="537" text-anchor="middle" fill="#C1C8C2">Wed</text>
    <rect x="194" y="512" width="52" height="40" rx="20" fill="#28302B"/><text x="220" y="537" text-anchor="middle" fill="#C1C8C2">Thu</text>
    <rect x="252" y="512" width="52" height="40" rx="20" fill="#28302B"/><text x="278" y="537" text-anchor="middle" fill="#C1C8C2">Fri</text>
    <rect x="310" y="512" width="52" height="40" rx="20" fill="#1E4E44"/><text x="336" y="537" text-anchor="middle" fill="#B7F0E2">Sat</text>
    <rect x="368" y="512" width="52" height="40" rx="20" fill="#28302B"/><text x="394" y="537" text-anchor="middle" fill="#C1C8C2">Sun</text>
  </g>
  <text x="20" y="576" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="12">Repeats Sat</text>
  <text x="20" y="612" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="14" font-weight="500">Ladder</text>
  <text x="20" y="640" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="18" font-weight="500">7:45    7:55    8:05    8:15</text>
  <text x="320" y="640" fill="#8FD9C6" font-family="Roboto, sans-serif" font-size="14" font-weight="500">+10 min</text>
  <text x="20" y="680" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="15">Sound</text>
  <text x="300" y="680" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="15">Default</text>
  <text x="20" y="712" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="15">Vibrate</text>
  <text x="300" y="712" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="15">Standard</text>
  <text x="20" y="744" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="15">Louder over</text>
  <text x="300" y="744" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="15">30 sec</text>
  <text x="20" y="776" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="15">Snooze</text>
  <text x="250" y="776" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="15">10 min, up to 3</text>
  <text x="20" y="808" fill="#C1C8C2" font-family="Roboto, sans-serif" font-size="15">Stops on its own</text>
  <text x="330" y="808" fill="#E7E6E1" font-family="Roboto, sans-serif" font-size="15">10 min</text>
  <text x="20" y="844" fill="#FFB4AB" font-family="Roboto, sans-serif" font-size="14">Delete Saturday morning</text>
  <rect x="20" y="880" width="408" height="64" rx="32" fill="#8FD9C6"/>
  <text x="224" y="918" text-anchor="middle" fill="#062E26" font-family="Roboto, sans-serif" font-size="16" font-weight="500">Save</text>
  <text x="20" y="970" fill="#8B938C" font-family="Roboto, sans-serif" font-size="12">Keypad is the default. Dial is the other segment. Save stays put.</text>
</svg>
